<div class="reset-password-container">
  <div class="reset-password-card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your new password to reset your account</p>

    <div class="alert alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="alert alert-success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="password-input-wrapper">
          <input 
            type="password" 
            id="newPassword" 
            formControlName="newPassword" 
            placeholder="Enter your new password"
            [class.invalid]="f['newPassword'].invalid && f['newPassword'].touched"
          />
        </div>
        <div class="error-message" *ngIf="f['newPassword'].invalid && f['newPassword'].touched">
          <span *ngIf="f['newPassword'].errors?.['required']">New password is required</span>
          <span *ngIf="f['newPassword'].errors?.['minlength']">Password must be at least 6 characters</span>
          <span *ngIf="f['newPassword'].errors?.['maxlength']">Password is too long</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmNewPassword">Confirm New Password</label>
        <div class="password-input-wrapper">
          <input 
            type="password" 
            id="confirmNewPassword" 
            formControlName="confirmNewPassword" 
            placeholder="Confirm your new password"
            [class.invalid]="(f['confirmNewPassword'].invalid && f['confirmNewPassword'].touched) || (resetForm.errors?.['passwordMismatch'] && f['confirmNewPassword'].touched)"
          />
        </div>
        <div class="error-message" *ngIf="f['confirmNewPassword'].invalid && f['confirmNewPassword'].touched">
          <span *ngIf="f['confirmNewPassword'].errors?.['required']">Please confirm your password</span>
        </div>
        <div class="error-message" *ngIf="resetForm.errors?.['passwordMismatch'] && f['confirmNewPassword'].touched">
          <span>Passwords do not match</span>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">
          Reset Password
        </button>
      </div>
    </form>
  </div>
</div>
