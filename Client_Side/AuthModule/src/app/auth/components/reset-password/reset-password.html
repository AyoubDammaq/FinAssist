
<form [formGroup]="resetForm" (ngSubmit)="onSubmit()" novalidate>
	<div>
		<label for="email">Email</label>
		<input id="email" type="email" formControlName="email" disabled />
	</div>
	<div>
		<label for="resetToken">Reset Token</label>
		<input id="resetToken" type="text" formControlName="resetToken" disabled />
	</div>
	<div>
		<label for="newPassword">New Password</label>
		<input id="newPassword" type="password" formControlName="newPassword" />
		<div *ngIf="submitted && f.newPassword.errors">
			<small *ngIf="f.newPassword.errors.required">New password is required.</small>
			<small *ngIf="f.newPassword.errors.minlength">Password must be at least 6 characters.</small>
			<small *ngIf="f.newPassword.errors.maxlength">Password is too long.</small>
		</div>
	</div>
	<div>
		<label for="confirmNewPassword">Confirm New Password</label>
		<input id="confirmNewPassword" type="password" formControlName="confirmNewPassword" />
		<div *ngIf="submitted && (f.confirmNewPassword.errors || resetForm.errors?.passwordMismatch)">
			<small *ngIf="f.confirmNewPassword.errors?.required">Confirmation is required.</small>
			<small *ngIf="resetForm.errors?.passwordMismatch">Passwords do not match.</small>
		</div>
	</div>
	<button type="submit">Reset Password</button>
	<div *ngIf="successMessage" style="color: green;">{{ successMessage }}</div>
	<div *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</div>
</form>
